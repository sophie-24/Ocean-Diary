services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ocean_diary
      POSTGRES_USER: ocean
      POSTGRES_PASSWORD: ocean
    ports:
      - "5432:5432"
    volumes:
      - ocean_diary_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocean -d ocean_diary"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ocean_diary_media:/data
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin >/dev/null 2>&1; do
          sleep 2
        done
        mc mb --ignore-existing local/ocean-diary-media
    restart: "no"

volumes:
  ocean_diary_db:
  ocean_diary_media:

